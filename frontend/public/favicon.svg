<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="umakGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1F5C" />
      <stop offset="100%" stop-color="#061338" />
    </linearGradient>
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5821F" />
      <stop offset="100%" stop-color="#E06900" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#F5821F" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Shield Container -->
  <rect width="512" height="512" rx="128" fill="url(#umakGradient)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#F5821F" stroke-width="12" stroke-opacity="0.4" />

  <!-- Central Modern Parking Badge (P + Shield/Heron Wing motif) -->
  <path d="M160 120 H280 C340 120 380 155 380 215 C380 275 340 310 280 310 H220 V392 C220 403 211 412 200 412 H180 C169 412 160 403 160 392 V120 Z" fill="url(#orangeGradient)" filter="url(#glow)" />
  <path d="M220 176 H275 C305 176 324 190 324 215 C324 240 305 254 275 254 H220 V176 Z" fill="#FFFFFF" />
  
  <!-- Subtle UMak Accent Dot -->
  <circle cx="390" cy="380" r="28" fill="#F5821F" />
</svg>